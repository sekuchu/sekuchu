    <text class="item-copy" x="36" y="195">Lexers, parsers, interpreters, compilers, LLVM.</text>

    <path d="M22 224H414" stroke="#30363d" stroke-width="2"/>
    <path d="M22 224H145" stroke="#9aa889" stroke-width="2"/>
